
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieExpress</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h2>🍔 FoodieExpress</h2>
        <nav>
            <a href="/">Home</a>
            <a href="#menu">Menu</a>
            <a href="#categories">Categories</a>
            <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Delicious Food, Delivered Fast!</h1>
        <p>Discover your favourite meals near you.</p>
        <input type="text" id="search" placeholder="Search for food...">
    </section>

    <section id="categories" class="categories">
        <h2>Food Categories</h2>
        <div class="category-list">
            <button onclick="filterFood('All')">All</button>
            <button onclick="filterFood('Pizza')">🍕 Pizza</button>
            <button onclick="filterFood('Burger')">🍔 Burger</button>
            <button onclick="filterFood('Biryani')">🍛 Biryani</button>      
            <button onclick="filterFood('South Indian')">South Indian</button>
            <button onclick="filterFood('Snacks')">Snacks</button>
            <button onclick="filterFood('Italian')">Italian</button>
            <button onclick="filterFood('Dessert')">🍰 Desserts</button>   

        </div>
    </section>

    <section id="menu" class="menu">
        <h2>Popular Dishes</h2>
        <div id="food-list" class="food-list"></div>
    </section>

    <section id="cart" class="cart">
        <h2>Your Cart</h2>
        <div id="cart-items">Your cart is empty.</div>
        <h3>Total: ₹<span id="cart-total">0</span></h3>

<button type="button" onclick="clearCart()">
    Clear Cart
</button>
        
<h3>Delivery Details</h3>

<form id="checkout-form" onsubmit="return false;">
    <input
        type="text"
        id="customer-name"
        placeholder="Enter your full name"
        required
    >

    <input
        type="tel"
        id="customer-phone"
        placeholder="Enter your 10-digit phone number"
        pattern="[0-9]{10}"
        maxlength="10"
        required
    >

    <textarea
        id="customer-address"
        placeholder="Enter your delivery address"
        required
    ></textarea>
</form>

    <button onclick="placeOrder()">Place Order</button>
    <p id="order-message"></p>


    </section>

    <footer>
        <p>© 2026 FoodieExpress | Made with ❤️ for food lovers</p>
    </footer>
    <script>
    const foods = {{ foods | tojson }};
</script>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
